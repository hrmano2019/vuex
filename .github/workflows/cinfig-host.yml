version: 2
jobs:
  build:
    docker:
      - image: circleci/node:16.20.0
    working_directory: ~/repo
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "package.json" }}
            - v1-dependencies-
      - run:
          name: Install dependencies
          command: yarn install --frozen-lockfile
      - run:
          name: Compile TypeScript
          command: yarn tsc --noEmit
      - run:
          name: Build project
          command: yarn run build
      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "package.json" }}
      - run:
          name: Run tests
          command: yarn test
      - run:
          name: Lint code
          command: yarn lint

  deploy-gh-pages:
    docker:
      - image: circleci/node:16.20.0
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: yarn install --frozen-lockfile
      - run:
          name: Build project
          command: yarn run build
      - run:
          name: Deploy to GitHub Pages
          command: |
            git config --global user.email "ci-bot@example.com"
            git config --global user.name "CircleCI Bot"
            yarn global add gh-pages
            gh-pages -d dist

  deploy-server:
    docker:
      - image: circleci/node:16.20.0
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Build project
          command: yarn run build
      - run:
          name: Deploy to server via SSH
          command: |
            ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_HOST "mkdir -p ~/app && rm -rf ~/app/*"
            scp -r dist/* $DEPLOY_USER@$DEPLOY_HOST:~/app/

workflows:
  version: 2
  build_test_deploy:
    jobs:
      - build
      - deploy-gh-pages:
          requires:
            - build
      # OR use server deployment
      - deploy-server:
          requires:
            - build
