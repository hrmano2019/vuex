version: 2.1

jobs:
  build-test-deploy:
    docker:
      - image: cimg/node:18.17
    steps:
      - checkout
      - run:
          name: Install Dependencies and CLIs
          command: |
            npm install
            npm install -g supabase vercel
      - run:
          name: Supabase Authentication
          # Using non-interactive login for CI
          command: |
            supabase login --token $SUPABASE_ACCESS_TOKEN
            supabase link --project-ref $SUPABASE_PROJECT_REF --password "2023$%"
      - run:
          name: Database Sync
          # Ensure migrations are pushed to the specific DB URL
          command: supabase db push --db-url $SUPABASE_DB_URL
      - run:
          name: Production Build
          command: npm run build
      - run:
          name: Deploy to Vercel
          command: |
            vercel pull --yes --environment=production --token=$VERCEL_TOKEN
            vercel build --prod --token=$VERCEL_TOKEN
            vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN --scope hrmano2019s-projects

workflows:
  build-deploy:
    jobs:
      - build-test-deploy:
          filters:
            branches:
              only: main