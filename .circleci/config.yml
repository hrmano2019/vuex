version: 2.1

jobs:
  node-build:
    docker:
      - image: cimg/node:20.11
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Install Node.js dependencies
          command: npm install
      - run:
          name: Run tests
          command: npm test
      - run:
          name: Build project
          command: npm run build

  php-build:
    docker:
      - image: cimg/php:8.2-node
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Install Composer dependencies
          command: composer install --no-interaction --prefer-dist --no-scripts
      - run:
          name: Run PHP tests
          command: composer test

  deploy-dev:
    docker:
      - image: cimg/node:20.11
    steps:
      - checkout
      - run:
          name: Deploy to Vercel (Dev)
          command: npx vercel --token $VERCEL_TOKEN --scope dev --confirm

  deploy-staging:
    docker:
      - image: cimg/node:20.11
    steps:
      - checkout
      - run:
          name: Deploy to Vercel (Staging)
          command: npx vercel --token $VERCEL_TOKEN --scope staging --confirm

  deploy-prod:
    docker:
      - image: cimg/node:20.11
    steps:
      - checkout
      - run:
          name: Deploy to Vercel (Prod)
          command: npx vercel --prod --token $VERCEL_TOKEN --confirm

workflows:
  # La clé "version: 2" obsolète a été supprimée d'ici
  build_and_deploy:
    jobs:
      - node-build
      - php-build
      - deploy-dev:
          requires:
            - node-build
            - php-build
          context: dev-context
          filters:
            branches:
              only: dev
      - deploy-staging:
          requires:
            - node-build
            - php-build
          context: staging-context
          filters:
            branches:
              only: staging
      - deploy-prod:
          requires:
            - node-build
            - php-build
          context: prod-context
          filters:
            branches:
              only: main