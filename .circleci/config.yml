version: 2.1

jobs:
  build_and_test:
    docker:
      - image: cimg/node:18.0   # Use Node 18 (secure, maintained)
    working_directory: ~/project
    steps:
      - checkout

      # Install dependencies
      - run:
          name: Install dependencies
          command: npm install

      # Build frontend (Vue.js)
      - run:
          name: Build frontend
          command: npm run build

      # Run backend tests (Node.js/Express)
      - run:
          name: Run backend tests
          command: npm test

      # Persist build artifacts
      - persist_to_workspace:
          root: .
          paths:
            - dist
            - backend

workflows:
  build_and_deploy:
    jobs:
      - build_and_test
