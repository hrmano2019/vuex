runtime: nodejs20
env: standard

env_variables:
  NODE_ENV: production
  NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

handlers:
  - url: /.*
    script: auto
      deploy-vercel:
    executor: node-executor
    steps:
      - checkout
      - run: npm install -g vercel
      - run: vercel --token $VERCEL_TOKEN --prod --confirm

