executors:
  node-executor:
    docker:
      - image: cimg/node:20.0

jobs:
  migrate:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Install Supabase CLI
          command: npm install -g supabase
      - run:
          name: Run Supabase migrations
          command: supabase db push --project-ref $SUPABASE_PROJECT_REF

  build:
    executor: node-executor
    steps:
      - checkout
      - run: npm install
      - run: npm run build
    executor: node-executor
    steps:
      - checkout
      - run: npm install -g vercel
      - run: vercel --token $VERCEL_TOKEN --prod --confirm

workflows:
  build-test-deploy:
    jobs:
      - migrate
      - build:
          requires:
            - migrate
