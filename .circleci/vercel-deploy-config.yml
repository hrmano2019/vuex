version: 2.1

executors:
  node-executor:
    docker:
      - image: cimg/node:20.0
    working_directory: ~/repo

jobs:
  build:
    executor: node-executor
    steps:
      - checkout
      - run: npm install
      - run: npm run build

  test:
    executor: node-executor
    steps:
      - checkout
      - run: npm install
      - run: npm test

  deploy-vercel:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Install Vercel CLI
          command: npm install -g vercel
      - run:
          name: Deploy to Vercel
          command: vercel --token $VERCEL_TOKEN --prod --confirm

workflows:
  build-test-deploy:
    jobs:
      - build
      - test:
          requires:
            - build
      - deploy-vercel:
          requires:
            - test
          filters:
            branches:
              only: main
