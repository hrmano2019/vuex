version: 2.1

executors:
  node-executor:
    docker:
      - image: cimg/node:20.0
    working_directory: ~/repo

jobs:
  migrate:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Install Supabase CLI
          command: npm install -g supabase
      - run:
          name: Run Supabase migrations
          command: supabase db push --project-ref $SUPABASE_PROJECT_REF --access-token $SUPABASE_ACCESS_TOKEN

  build:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm install
      - run:
          name: Build project
          command: npm run build

  test:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm install
      - run:
          name: Run tests
          command: npm test

  deploy-vercel:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Install Vercel CLI
          command: npm install -g vercel
      - run:
          name: Deploy to Vercel
          command: vercel --token $VERCEL_TOKEN --prod --confirm

workflows:
  build-test-deploy:
    jobs:
      - migrate
      - build:
          requires:
            - migrate
      - test:
          requires:
            - build
      - deploy-vercel:
          requires:
            - test
          filters:
            branches:
              only: main
