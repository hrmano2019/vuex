version: 2.1

executors:
  node-executor:
    docker:
      - image: cimg/node:20.0
      - image: postgres:15
        environment:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
    working_directory: ~/repo

jobs:
  build:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm install
      - run:
          name: Build project
          command: npm run build

  test:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm install
      - run:
          name: Wait for Postgres
          command: dockerize -wait tcp://localhost:5432 -timeout 60s
      - run:
          name: Run migrations
          command: npm run migrate:test
      - run:
          name: Run tests
          command: npm test

workflows:
  build-test:
    jobs:
      - build
      - test:
          requires:
            - build
